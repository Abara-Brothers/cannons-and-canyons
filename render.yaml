# Render.com blueprint. Push this repo to GitHub, then in Render:
# New + → Blueprint → pick the repo. It reads this file and deploys.
# Render injects PORT automatically and supports WebSockets on the free plan.
services:
  - type: web
    # Must match the live service. Renaming here would make a blueprint sync
    # create a SECOND service rather than update this one.
    name: cannons-canyons
    region: singapore
    runtime: node
    # Must match the live service. A blueprint sync against `free` would
    # DOWNGRADE the paid instance and reintroduce idle spin-down.
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Push signing keys. server.js prefers these and only falls back to
      # generating a pair into data/vapid.json — which lives on an EPHEMERAL
      # filesystem, so without these every deploy silently invalidates every
      # existing push subscription (ISSUE-002). `sync: false` makes Render
      # prompt for the value instead of storing it in this file; never commit
      # the private key. Generate a pair with:
      #     node -e "console.log(require('web-push').generateVAPIDKeys())"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Supabase (ADR-005). Project is ap-southeast-1, co-located with this
      # service. DATABASE_URL must be the SESSION POOLER string, never the
      # direct `db.<ref>.supabase.co` host — that host is IPv6-only (measured:
      # 0 A records) and unreachable from Render, which fails as an obscure
      # connection error rather than anything mentioning IPv6.
      # SUPABASE_SECRET_KEY bypasses row-level security: server-side only,
      # never in public/.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
# NOTE (ISSUE-005, partially resolved 2026-08-04): the live service is on the
# paid Starter plan, so idle spin-down and its 30-60s cold start are gone.
# STILL OPEN: there is no staging service, and all match state lives in the
# in-process `rooms` Map — so every deploy still destroys live matches. Fixing
# that needs either a staging service to deploy against first, or persisted
# rooms (which depends on the Supabase work above).
